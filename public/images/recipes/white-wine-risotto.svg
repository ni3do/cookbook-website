<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">White wine risotto</title>
  <desc id="desc">Illustrated shallow bowl of creamy risotto with Parmesan and herbs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5e0dc"/>
      <stop offset="0.5" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#a6e3a1"/>
    </linearGradient>
    <radialGradient id="bowl" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f9e2af"/>
      <stop offset="0.6" stop-color="#fab387"/>
      <stop offset="1" stop-color="#eba0ac"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#11111b" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="180" cy="140" r="160" fill="#89b4fa" opacity="0.22"/>
  <circle cx="1050" cy="680" r="200" fill="#cba6f7" opacity="0.2"/>
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="500" rx="420" ry="220" fill="#313244"/>
    <ellipse cx="600" cy="460" rx="390" ry="195" fill="url(#bowl)"/>
    <ellipse cx="600" cy="430" rx="320" ry="145" fill="#f5e0dc" opacity="0.95"/>
    <ellipse cx="600" cy="420" rx="280" ry="120" fill="#f9e2af" opacity="0.9"/>
    <g fill="#a6e3a1" opacity="0.85">
      <ellipse cx="480" cy="390" rx="18" ry="10" transform="rotate(-20 480 390)"/>
      <ellipse cx="720" cy="400" rx="16" ry="9" transform="rotate(25 720 400)"/>
      <ellipse cx="560" cy="450" rx="14" ry="8" transform="rotate(-10 560 450)"/>
    </g>
    <circle cx="640" cy="380" r="8" fill="#cdd6f4" opacity="0.9"/>
    <circle cx="520" cy="410" r="6" fill="#cdd6f4" opacity="0.85"/>
    <circle cx="690" cy="430" r="5" fill="#cdd6f4" opacity="0.8"/>
  </g>
</svg>

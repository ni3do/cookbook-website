    <path d="M720 390 q40 -30 80 -5" stroke="#fe640b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M400 395 q40 -25 70 0" stroke="#fe640b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g fill="#df8e1d"><circle cx="560" cy="330" r="7"/><circle cx="640" cy="390" r="6"/><circle cx="480" cy="390" r="6"/></g>

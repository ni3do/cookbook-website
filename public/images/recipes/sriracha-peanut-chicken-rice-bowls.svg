<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sriracha peanut chicken rice bowls</title>
  <desc id="desc">Illustrated rice bowl with chicken, broccoli, carrots and peanuts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e2af"/>
      <stop offset="0.6" stop-color="#fab387"/>
      <stop offset="1" stop-color="#e78284"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#11111b" flood-opacity="0.3"/>

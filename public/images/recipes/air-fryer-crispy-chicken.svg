<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Air-fryer crispy chicken</title>
  <desc id="desc">Illustrated golden breaded chicken cutlets with lemon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2cdcd"/>
      <stop offset="0.55" stop-color="#fab387"/>
      <stop offset="1" stop-color="#f9e2af"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e2af"/>
      <stop offset="0.45" stop-color="#fab387"/>
      <stop offset="1" stop-color="#e78284"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#11111b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="140" cy="660" r="180" fill="#a6e3a1" opacity="0.2"/>
  <circle cx="1080" cy="120" r="150" fill="#89dceb" opacity="0.22"/>
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="430" rx="210" ry="120" fill="url(#crust)" transform="rotate(-18 430 430)"/>
    <ellipse cx="700" cy="460" rx="200" ry="110" fill="url(#crust)" transform="rotate(12 700 460)"/>
    <g fill="#f5e0dc" opacity="0.35">
      <circle cx="360" cy="400" r="6"/><circle cx="480" cy="450" r="5"/><circle cx="410" cy="470" r="4"/>
      <circle cx="650" cy="430" r="6"/><circle cx="760" cy="480" r="5"/><circle cx="720" cy="440" r="4"/>
    </g>
  </g>
  <g transform="translate(920 520)">
    <ellipse cx="0" cy="40" rx="70" ry="28" fill="#a6e3a1" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="55" ry="70" fill="#f9e2af"/>
    <ellipse cx="0" cy="-10" rx="40" ry="50" fill="#f5e0dc"/>
  </g>
</svg>
